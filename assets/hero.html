<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% 110%, rgba(57, 211, 83, 0.12), transparent 60%),
      radial-gradient(ellipse 600px 400px at 50% -10%, rgba(88, 166, 255, 0.08), transparent 60%),
      linear-gradient(135deg, #0a0e14 0%, #0d1117 60%, #010409 100%);
    color: #e6edf3;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 80px;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(88, 166, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 166, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  /* Hash-chain accent running along the bottom edge — visual signature of the audit-trail feature */
  .chain-accent {
    position: absolute;
    bottom: 22px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Consolas, 'Cascadia Code', monospace;
    font-size: 11px;
    color: #39d353;
    opacity: 0.55;
    letter-spacing: 0.08em;
    z-index: 2;
  }
  .chain-accent .hash {
    color: #7d8590;
    font-size: 10px;
  }
  .chain-accent .pipe {
    color: #30363d;
  }
  .chain-accent .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(57, 211, 83, 0.4) 0%, rgba(57, 211, 83, 0) 100%);
  }
  /* Top eyebrow */
  .eyebrow {
    font-family: Consolas, 'Cascadia Code', monospace;
    color: #39d353;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow .sep { color: #30363d; }
  .eyebrow .item { display: inline-flex; align-items: center; gap: 6px; }
  .eyebrow .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #39d353;
    box-shadow: 0 0 6px #39d353;
  }
  /* Main hero stack — shield + wordmark + tagline + chips */
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    z-index: 2;
  }
  .shield {
    width: 64px;
    height: 72px;
    filter: drop-shadow(0 0 18px rgba(57, 211, 83, 0.45));
  }
  h1 {
    font-size: 68px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #b1bac4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }
  .tagline {
    color: #b1bac4;
    font-size: 18px;
    line-height: 1.5;
    max-width: 720px;
    text-align: center;
    font-weight: 400;
  }
  .chips {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .chip {
    font-family: Consolas, 'Cascadia Code', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 16px;
    border: 1px solid rgba(57, 211, 83, 0.4);
    border-radius: 4px;
    background: rgba(57, 211, 83, 0.07);
    color: #e6edf3;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.06em;
  }
  .chip::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #39d353;
    box-shadow: 0 0 6px #39d353;
  }
</style>
</head>
<body>
  <div class="eyebrow">
    <span class="item"><span class="dot"></span>Open-source</span>
    <span class="sep">·</span>
    <span class="item">MIT</span>
    <span class="sep">·</span>
    <span class="item">v1.2.0</span>
  </div>

  <div class="stack">
    <svg class="shield" viewBox="0 0 64 72" fill="none">
      <path d="M32 2 L60 12 V36 C60 54 48 66 32 70 C16 66 4 54 4 36 V12 Z"
            stroke="#39d353" stroke-width="2" fill="rgba(57, 211, 83, 0.08)"/>
      <path d="M20 36 L29 45 L46 26"
            stroke="#39d353" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h1>Curtis Compliance</h1>
    <p class="tagline">Open-source compliance checks for fintech code. Pre-commit gate, PR review, and a hash-chained audit trail you can hand to your SOC 2 / PCI-DSS auditor.</p>
    <div class="chips">
      <span class="chip">HIPAA</span>
      <span class="chip">SOC 2</span>
      <span class="chip">PCI-DSS</span>
    </div>
  </div>

  <div class="chain-accent">
    <span class="hash">prev_hash</span>
    <span>0000a3c7f3</span>
    <span class="pipe">→</span>
    <span>7f3b9e2c1a</span>
    <span class="pipe">→</span>
    <span>b8d4f6a9e2</span>
    <span class="pipe">→</span>
    <span style="color: #39d353; font-weight: 600;">[ new event ]</span>
    <span class="line"></span>
    <span class="hash" style="color: #39d353;">chain intact ✓</span>
  </div>
</body>
</html>
